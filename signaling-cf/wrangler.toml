name = "pixelworld-signaling"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Single-instance signaling room. SQLite-backed DO class = eligible for the FREE plan
# (we don't use storage; the class just needs to be declared this way).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "SignalRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]
