# Render Blueprint — deploys the signaling server (free, no credit card).
# In Render: New +  ->  Blueprint  ->  pick your repo. It reads this file.
services:
  - type: web
    name: pixelmesh-signaling
    runtime: node
    rootDir: signaling
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
