# Fly.io config for the signaling server. Rename `app` to something unique, then:
#   cd signaling && fly launch --no-deploy --copy-config && fly deploy
app = "pixelmesh-sig"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false      # keep it warm so peers can always be introduced
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/"
